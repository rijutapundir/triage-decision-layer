# The live site is the deploy/ folder only. Everything else in this repo
# (tests, reference simulations, docs, QA reports) is never served.
[build]
  publish = "deploy"
  # Build only when the site or this config changed, so docs and QA commits cost no deploy.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- deploy/ netlify.toml"
